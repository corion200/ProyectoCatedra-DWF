# =====================================================================
# UCA-CFC-CONNECT - Configuracion base de la aplicacion
# =====================================================================

# ---------------------- INFORMACION DE LA APP ----------------------
spring.application.name=uca-cfc-connect

# ---------------------- SERVIDOR ----------------------
server.port=8080
server.servlet.context-path=/api/v1

# ---------------------- BASE DE DATOS (PostgreSQL) ----------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/uca_cfc_connect_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------- BASE DE DATOS (MySQL) - alternativo ----------------------
# Si se usa MySQL en lugar de PostgreSQL, comentar el bloque anterior
# y descomentar este bloque (recordar tambien cambiar el driver en pom.xml).
# spring.datasource.url=jdbc:mysql://localhost:3306/uca_cfc_connect_db?useSSL=false&serverTimezone=UTC
# spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:root}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------- JPA / HIBERNATE ----------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Dialecto (opcional, Hibernate 6 lo autodetecta; se deja explicito por claridad)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Para MySQL: org.hibernate.dialect.MySQLDialect

# ---------------------- JACKSON (JSON) ----------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/El_Salvador

# ---------------------- SEGURIDAD / JWT ----------------------
security.jwt.secret-key=${JWT_SECRET:CambiarEstaClaveSecretaEnProduccion123456789}
security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# ---------------------- SWAGGER / OPENAPI ----------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ---------------------- LOGGING ----------------------
logging.level.root=INFO
logging.level.sv.edu.udb.cfc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

# ---------------------- MULTIPART (subida de archivos, ej. constancias/PDF) ----------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
