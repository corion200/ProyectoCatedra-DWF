# =====================================================================
# UCA-CFC-CONNECT - Configuracion base de la aplicacion
# =====================================================================

spring.application.name=uca-cfc-connect

# ---------------------- SERVIDOR ----------------------
server.port=8080
# FIX: comentado - nuestros controladores ya incluyen /api/v1 en su @RequestMapping.
# Si el equipo prefiere context-path, hay que quitar /api/v1 de los controllers.
# server.servlet.context-path=/api/v1

# ---------------------- BASE DE DATOS (MySQL/XAMPP) ----------------------
# FIX: BD apunta a uca_cfc_db (la que crea DB.sql) + allowPublicKeyRetrieval
spring.datasource.url=jdbc:mysql://localhost:3306/uca_cfc_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
# FIX: default vacío (XAMPP trae root SIN contraseña). Si tu MySQL tiene
# contraseña, define la variable de entorno DB_PASSWORD o ponla aqui.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------- JPA / HIBERNATE ----------------------
# FIX: none - el esquema lo gobierna DB.sql (evita que Hibernate cree/altere
# tablas por su cuenta, sin CHECKs ni constraints del DDL)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------- JACKSON (JSON) ----------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/El_Salvador

# ---------------------- SEGURIDAD / JWT (props del equipo - sin uso todavia) ------
security.jwt.secret-key=${JWT_SECRET:CambiarEstaClaveSecretaEnProduccion123456789}
security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# ---------------------- SWAGGER / OPENAPI ----------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ---------------------- LOGGING ----------------------
logging.level.root=INFO
logging.level.sv.edu.udb.cfc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

# ---------------------- MULTIPART ----------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB